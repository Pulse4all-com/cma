# Cloud Build: build the web image, push it to Artifact Registry, deploy to
# Cloud Run cma-web. Triggered on main for changes under web/ (and this file);
# the same file runs by hand with `gcloud builds submit`, which must pass the trigger's substitutions:
# since 17 October 2026 check-config refuses the file's own defaults (iap without an audience).
#
# The deploy sets ALL environment variables of the service (--set-env-vars), so
# this file and the trigger's substitutions are the one place the service is
# configured. Never change env vars on the service by hand: the next build
# would silently undo it.
#
# Substitutions set on the trigger (or passed to builds submit):
#   _IAP_AUDIENCE   /projects/<number>/global/backendServices/<backend id>
#   _AUTH_MODE      iap   (mock only for a build that never meets a person)
#   _DATA_MODE      api | mock   (api needs _DB_INSTANCE and _DB_USER)
#   _DB_INSTANCE    <project>:<region>:<instance>   Cloud SQL connection name
#   _DB_USER        <service account>@<project>.iam   IAM database user, member of cma_app
#   _DB_NAME        cma
#   _DB_POOL_MAX    connections per instance (default 5)
#   _MAX_INSTANCES  Cloud Run ceiling (default 4); instances x pool must stay well
#                   under the database's max_connections (README, Database connection budget)
#   _LOGOUT_TARGET  legacy (default): Log out lands on /logout/done; signed-out: on the static
#                   page outside IAP, only after docs/signed-out/deploy.sh prod --apply and its
#                   test plan (docs/signed-out/README.md)
#   _REGION         europe-west4
#   _SERVICE        cma-web
#   _REPO           europe-west4-docker.pkg.dev/$PROJECT_ID/cma
steps:
  - id: check-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_DATA_MODE}" = "api" ] && { [ -z "${_DB_INSTANCE}" ] || [ -z "${_DB_USER}" ]; }; then
          echo "_DATA_MODE=api needs _DB_INSTANCE and _DB_USER on the trigger; nothing deployed"
          exit 1
        fi
        case "${_LOGOUT_TARGET}" in
          legacy|signed-out) ;;
          *) echo "_LOGOUT_TARGET must be legacy or signed-out, got '${_LOGOUT_TARGET}'; nothing deployed"; exit 1 ;;
        esac
        # The IT audit of 17 October 2026 (INFRA-01): a build whose substitutions fell back to the file's
        # defaults must stop here, not lock everyone out after a successful-looking deploy
        case "${_AUTH_MODE}" in
          iap|mock) ;;
          *) echo "_AUTH_MODE must be iap or mock, got '${_AUTH_MODE}'; nothing deployed"; exit 1 ;;
        esac
        case "${_DATA_MODE}" in
          api|mock) ;;
          *) echo "_DATA_MODE must be api or mock, got '${_DATA_MODE}'; nothing deployed"; exit 1 ;;
        esac
        if [ "${_AUTH_MODE}" = "iap" ] && ! [[ "${_IAP_AUDIENCE}" =~ ^/projects/[0-9]+/global/backendServices/[0-9]+$$ ]]; then
          echo "_AUTH_MODE=iap needs _IAP_AUDIENCE as /projects/<number>/global/backendServices/<id>, got '${_IAP_AUDIENCE}'; nothing deployed"
          exit 1
        fi
        if ! [[ "${_MAX_INSTANCES}" =~ ^[1-9][0-9]*$$ ]] || ! [[ "${_DB_POOL_MAX}" =~ ^[1-9][0-9]*$$ ]]; then
          echo "_MAX_INSTANCES and _DB_POOL_MAX must be whole numbers above 0, got '${_MAX_INSTANCES}' and '${_DB_POOL_MAX}'; nothing deployed"
          exit 1
        fi
        echo "config: auth=${_AUTH_MODE} data=${_DATA_MODE} db=${_DB_INSTANCE} max-instances=${_MAX_INSTANCES} pool=${_DB_POOL_MAX} logout=${_LOGOUT_TARGET}"

  # System health documents (addition 0008r): the files docs/system-health/documents.txt names, copied by basename into
  # web/documents/ so the Docker build (context web/) can list them in its manifest. A file not in this commit is skipped
  # and said so; the page then shows the documents that are in the build. Bash variables are written $$ (Cloud Build
  # substitution syntax).
  - id: copy-documents
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        mkdir -p web/documents
        n=0
        while IFS= read -r f || [ -n "$$f" ]; do
          case "$$f" in ''|'#'*) continue ;; esac
          if [ -f "$$f" ]; then cp "$$f" web/documents/; n=$$((n+1)); else echo "documents: $$f is not in this commit, skipped"; fi
        done < docs/system-health/documents.txt
        echo "documents: $$n file(s) copied into web/documents"

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: web
    args:
      - build
      - --build-arg=CMA_VERSION=${SHORT_SHA}
      - --tag=${_REPO}/web:${SHORT_SHA}
      - --tag=${_REPO}/web:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REPO}/web"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REPO}/web:${SHORT_SHA}
      - --port=8080
      - --max-instances=${_MAX_INSTANCES}
      # The IT audit of 17 October 2026 (INFRA-01, INFRA-02): the floor the console has held since 12 October
      # 2026 (README, Decision log) now in the file; a startup probe on /api/health, which answers 503 when the
      # running configuration cannot serve anyone, so such a revision never takes traffic; the startup CPU boost
      # that cma-ingest has had since 13 October 2026. Connection budget unchanged (max-instances and the pool).
      - --min-instances=1
      - --startup-probe=httpGet.path=/api/health,httpGet.port=8080,periodSeconds=2,timeoutSeconds=2,failureThreshold=30
      - --cpu-boost
      - --set-env-vars=CMA_AUTH_MODE=${_AUTH_MODE},CMA_DATA_MODE=${_DATA_MODE},IAP_AUDIENCE=${_IAP_AUDIENCE},CMA_VERSION=${SHORT_SHA},CMA_DB_INSTANCE=${_DB_INSTANCE},CMA_DB_USER=${_DB_USER},CMA_DB_NAME=${_DB_NAME},CMA_DB_POOL_MAX=${_DB_POOL_MAX},CMA_LOGOUT_TARGET=${_LOGOUT_TARGET}
      - --quiet

images:
  - ${_REPO}/web:${SHORT_SHA}
  - ${_REPO}/web:latest

substitutions:
  _REGION: europe-west4
  _SERVICE: cma-web
  _REPO: europe-west4-docker.pkg.dev/${PROJECT_ID}/cma
  _AUTH_MODE: iap
  _DATA_MODE: mock
  _IAP_AUDIENCE: ""
  _DB_INSTANCE: ""
  _DB_USER: ""
  _DB_NAME: cma
  _DB_POOL_MAX: "5"
  _MAX_INSTANCES: "4"
  _LOGOUT_TARGET: legacy

options:
  dynamicSubstitutions: true
  # Required when the build runs as a user-managed service account
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
